<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Cake Studio | Sweet Moments</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@300;600&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { height: 100vh; overflow: hidden; font-family: 'Quicksand', sans-serif; background: #fff5f8; }

        .cake-wrapper {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Soft Pink Aesthetic Background */
            background: linear-gradient(135deg, #fce4ec 0%, #f8bbd0 100%);
            padding: 20px;
        }

        .main-card {
            width: 95%;
            max-width: 1100px;
            height: 80vh;
            background: #fff;
            border-radius: 60px 20px 60px 20px;
            display: flex;
            box-shadow: 0 30px 60px rgba(240, 98, 146, 0.2);
            overflow: hidden;
            position: relative;
            border: 2px solid #f8bbd0;
        }

        /* Decorative Confetti Overlay */
        .main-card::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://www.transparenttextures.com/patterns/cubes.png');
            opacity: 0.03;
            pointer-events: none;
        }

        /* Left Side: Content */
        .info-panel {
            flex: 1;
            padding: 60px 80px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            z-index: 5;
        }

        .studio-label {
            font-family: 'Dancing Script', cursive;
            color: #d81b60;
            font-size: 1.8rem;
            margin-bottom: 15px;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 5rem;
            line-height: 0.9;
            color: #4a148c;
            margin-bottom: 25px;
        }

        h1 span {
            color: #ec407a;
            display: block;
            font-size: 3.5rem;
            font-weight: 400;
            font-style: italic;
        }

        p {
            color: #7a5a7a;
            line-height: 1.8;
            margin-bottom: 40px;
            font-size: 1.1rem;
            max-width: 400px;
        }

        .order-btn {
            padding: 20px 45px;
            background: #d81b60;
            color: #fff;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: 0.4s;
            width: fit-content;
            box-shadow: 0 10px 20px rgba(216, 27, 96, 0.3);
        }

        .order-btn:hover {
            background: #4a148c;
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(74, 20, 140, 0.3);
        }

        /* Right Side: Cake Image */
        .visual-panel {
            flex: 1.3;
            position: relative;
            background: #fff;
            overflow: hidden;
        }

        .cake-pic {
            width: 100%;
            height: 100%;
            /* Beautiful Gourmet Cake Image */
            background: url('https://images.unsplash.com/photo-1578985545062-69928b1d9587?q=80&w=1989') no-repeat center center/cover;
            transition: 1.5s cubic-bezier(0.19, 1, 0.22, 1);
        }

        .main-card:hover .cake-pic {
            transform: scale(1.1);
        }

        .offer-tag {
            position: absolute;
            top: 40px;
            right: 40px;
            background: #fff;
            color: #d81b60;
            padding: 15px 25px;
            border-radius: 15px;
            font-weight: 900;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            border: 1px solid #fce4ec;
        }
    </style>
</head>
<body>

    <div class="cake-wrapper">
        <div class="main-card">
            <div class="info-panel">
                <div class="studio-label">Handcrafted with Love</div>
                <h1>Sweet<span>Delight.</span></h1>
                <p>Khushiyon ka ek naya zayeqa. Hamare fresh baked cakes banate hain har mauqe ko yaadgar aur har pal ko meetha.</p>
                <a href="#" class="order-btn">Treat Yourself</a>
            </div>

            <div class="visual-panel">
                <div class="cake-pic"></div>
                <div class="offer-tag">FRESHLY BAKED</div>
            </div>
        </div>
    </div>

</body>
</html>
